<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Analítica | Lógica de Programación</title>
    
    <!-- Google Fonts for Swiss Light Tech UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome / Lucide Icons via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor">
        <!-- Menú Lateral Workspace -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>OperacionesEstructuras <i class="fa-solid fa-shapes"></i></h2>
                <span class="badge-tech"><div class="pulse-dot"></div> Estado: Listo</span>
            </div>
            
            <div class="menu-item">
                <button class="menu-btn">
                    <span><i class="fa-solid fa-list-ol"></i> 1. Secuenciales (10)</span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 11px; color: var(--text-muted);"></i>
                </button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="sec1">1. Suma de números</button>
                    <button class="ejercicio-btn" data-ejercicio="sec2">2. Área de rectángulo</button>
                    <button class="ejercicio-btn" data-ejercicio="sec3">3. Nota definitiva ITFIP</button>
                    <button class="ejercicio-btn" data-ejercicio="sec4">4. Área circunferencia</button>
                    <button class="ejercicio-btn" data-ejercicio="sec5">5. Área terreno irregular</button>
                    <button class="ejercicio-btn" data-ejercicio="sec6">6. Área tipo gota</button>
                    <button class="ejercicio-btn" data-ejercicio="sec7">7. Producción de leche</button>
                    <button class="ejercicio-btn" data-ejercicio="sec8">8. Distancia 2 puntos</button>
                    <button class="ejercicio-btn" data-ejercicio="sec9">9. Metros a pulgadas</button>
                    <button class="ejercicio-btn" data-ejercicio="sec10">10. Llenado alberca</button>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-btn">
                    <span><i class="fa-solid fa-code-branch"></i> 2. Condicionales (7)</span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 11px; color: var(--text-muted);"></i>
                </button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="cond1">1. Mayor de dos</button>
                    <button class="ejercicio-btn" data-ejercicio="cond2">2. Positivo o Negativo</button>
                    <button class="ejercicio-btn" data-ejercicio="cond3">3. Venta de Lápices</button>
                    <button class="ejercicio-btn" data-ejercicio="cond4">4. Almacenes Pepita</button>
                    <button class="ejercicio-btn" data-ejercicio="cond5">5. Mayor de tres</button>
                    <button class="ejercicio-btn" data-ejercicio="cond6">6. Presupuesto Parrillada</button>
                    <button class="ejercicio-btn" data-ejercicio="cond7">7. Citas Ginecólogo</button>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-btn">
                    <span><i class="fa-solid fa-rotate-right"></i> 3. Ciclos (5)</span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 11px; color: var(--text-muted);"></i>
                </button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="ciclo1">1. Promedio general</button>
                    <button class="ejercicio-btn" data-ejercicio="ciclo2">2. Aprobados/Reprobados</button>
                    <button class="ejercicio-btn" data-ejercicio="ciclo3">3. Análisis numérico</button>
                    <button class="ejercicio-btn" data-ejercicio="ciclo4">4. Promedio Financiera</button>
                    <button class="ejercicio-btn" data-ejercicio="ciclo5">5. Consumo Eléctrico</button>
                </div>
            </div>
        </aside>

        <!-- Área de Trabajo Central (Canvas) -->
        <main class="contenido-principal">
            <section id="area-ejercicio" class="tarjeta-ejercicio bienvenida fade-in">
                <div class="bienvenida-content">
                    <h1>Plataforma Analítica</h1>
                    <p>Entorno de cómputo inicializado. Selecciona un proceso del panel lateral para comenzar.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Script sin modificaciones -->
    <script src="js/script.js" defer></script>
</body>
</html>
